# Truth gate configuration.
#
# Wikipedia and sites that mirror or republish it are banned. A DOI, a
# statute, a dataset, and a transcription of a primary text are not Wikipedia.
# Wikisource is a transcription library. It is classified below as primary_text.
# The Stanford Encyclopedia of Philosophy is a refereed encyclopedia. It is
# not a Wikipedia mirror.
#
# Add a host to banned_suffixes to reject it. The ceiling for a class is the
# highest evidence_strength that class can support on its own.

banned_suffixes = [
  "wikipedia.org",
  "wikipedia.com",
  "wikimedia.org",
  "wikidata.org",
  "wikimediafoundation.org",
  "wikiwand.com",
  "wikiless.org",
  "dbpedia.org",
  "everipedia.org",
  "thefullwiki.org",
  "wiki2.org",
]

# Matched against the hostname only. "wikipedia" catches language subdomains
# and look-alike hosts. It does not match wikisource.org.
banned_host_substrings = ["wikipedia", "wikiwand", "wikiless", "dbpedia"]

# Phrases that mean the card text is talking about Wikipedia or a derivative.
# A warning, including when the sentence says the derivative was not used.
mention_phrases = ["wikipedia", "wikimedia", "wikidata", "wikiwand", "dbpedia"]

placeholder_suffixes = ["example.com", "example.org", "example.net", "localhost", "invalid"]

# doi.org is a resolver, not one outlet. It is left out of outlet-dominance.
resolver_domains = ["doi.org"]

official_suffixes = [".gov", ".mil", ".gov.uk", ".gov.au", ".gc.ca", ".gouv.fr", ".gov.tr"]

ceilings.peer_reviewed = "strong"
ceilings.preprint = "strong"
ceilings.official = "strong"
ceilings.primary_text = "strong"
ceilings.dataset = "strong"
ceilings.scholarly_secondary = "moderate"
ceilings.house = "weak"
ceilings.news = "weak"
ceilings.other = "weak"

# Near-duplicate: token Jaccard of title + summary + body.
# The second pair of thresholds catches two cards with the same title and a shared body
# when the full-text score is lower.
near_duplicate_jaccard = 0.40
title_jaccard = 0.45
body_jaccard_with_title = 0.22

# One registrable domain, other than a resolver, at or above this share of a
# category's source URLs. One government or IGO voice is the same kind of warning.
outlet_share = 0.60
outlet_min_urls = 6
voice_share = 0.75
voice_min_urls = 8

recommended_statuses = [
  "draft",
  "sourced",
  "sourced - needs review",
  "unsourced - needs review",
  "reviewed",
  "archived",
]

# Value-laden and propaganda words. A hit on a fact card is a flag.
# It does not reject the card and it does not rewrite the sentence.
loaded_phrases = [
  "alarmist",
  "atrocities",
  "atrocity",
  "barbaric",
  "barbarous",
  "brainwash",
  "brainwashed",
  "brainwashing",
  "cancel culture",
  "crisis actor",
  "cult",
  "debunked",
  "deep state",
  "denialist",
  "denialists",
  "disgraceful",
  "dog whistle",
  "everyone knows",
  "extremist",
  "extremists",
  "fake news",
  "false flag",
  "fascist",
  "fascists",
  "freedom fighter",
  "genocide",
  "globalist",
  "hoax",
  "horrific",
  "illegal alien",
  "illegal aliens",
  "indoctrination",
  "insane",
  "kangaroo court",
  "libtard",
  "mainstream media",
  "monstrous",
  "nazi",
  "nazis",
  "new world order",
  "outrageous",
  "propaganda",
  "pseudoscience",
  "pure evil",
  "quack",
  "racist",
  "regime",
  "savage",
  "sheeple",
  "snowflake",
  "so-called",
  "terrorist",
  "terrorists",
  "traitor",
  "undeniable",
  "unprecedented",
  "villain",
  "virtue signaling",
  "virtue signalling",
  "wicked",
  "witch hunt",
  "woke",
  "worthless",
]

